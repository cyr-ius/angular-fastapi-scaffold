# Command line Alembic (from backend/), e.g. a new revision from the models:
#   uv run alembic revision --autogenerate -m "add item table"
# The application applies the migrations itself at startup.
[alembic]
script_location = app/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
