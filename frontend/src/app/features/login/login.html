<main class="container py-5" style="max-width: 24rem">
  <h1 class="h3 mb-4"><i class="bi bi-box-arrow-in-right"></i> Sign in</h1>
  <form (ngSubmit)="submit()">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input
        id="username"
        name="username"
        class="form-control"
        autocomplete="username"
        required
        [(ngModel)]="username"
      />
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        class="form-control"
        autocomplete="current-password"
        required
        [(ngModel)]="password"
      />
    </div>
    @if (error(); as message) {
    <div class="alert alert-danger" role="alert">{{ message }}</div>
    }
    <button type="submit" class="btn btn-primary w-100" [disabled]="pending()">Sign in</button>
  </form>
</main>
