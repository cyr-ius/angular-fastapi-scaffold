---
# Projects created from this template target their `dev` branch: web/sync.sh of
# cyr-ius/.github adds `target-branch: "dev"` to every entry.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      fastapi-pydantic:
        patterns:
          - "fastapi*"
          - "pydantic*"
      sqlmodel-sqlalchemy:
        patterns:
          - "sqlmodel"
          - "sqlalchemy"
          - "alembic"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "rxjs"
          - "typescript"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
